<!--
  ui-demo screen: a Zalo-style group chat (simplified recreation, light theme, Vietnamese UI). A compact chat window
  (640×520); the camera zooms in and pans down message by message. The friends, their initials and their
  messages are invented — nobody real. Fidelity: no reference screenshot; Zalo's look from memory, kept generic.

  Per-video: the group name, the shared file's name, and the five messages — short (≤ 8 words), casual, one per
  spoken clause, saying what the narration says (thanks, what it changed for them), no numbers presented as
  results. Messages take their space from the start (data-off, no data-grow) so the camera can pan to each
  one: steps = { focus "[data-ui=mN] .zl-b", zoom 1.5, at ≈ show − 0.12 } + { show "[data-ui=mN]", from "up" }.
  Used in: master-prompt-cuong-v4 (koi), 2026-11-04.

  Targets (data-ui):
    msgs  file  m1…m5  react
-->
<style>

  .zl-msgs { position: absolute; left: 0; right: 0; top: 10px; padding: 0 16px; }

  .zl-av { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .zl-who { font-size: 12px; color: #7589a3; line-height: 16px; margin-left: 2px; }
  .zl-b { display: inline-block; max-width: 430px; padding: 8px 12px; border-radius: 12px; background: #fff; line-height: 20px; white-space: nowrap;

  .zl-me { justify-content: flex-end; }
  .zl-file { position: relative; display: flex; align-items: center; gap: 10px; width: 250px; padding: 9px 12px; border-radius: 12px; background: #e5efff;

  .zl-file .ic { width: 34px; height: 38px; border-radius: 6px; background: #0068ff; display: flex; align-items: center; justify-content: center; }
  .zl-file b { display: block; font-size: 15px; line-height: 1.2; }
  .zl-file small { display: block; font-size: 12px; color: #7589a3; }
  .zl-react { position: absolute; right: -6px; bottom: -10px; height: 22px; padding: 0 7px; border-radius: 11px; background: #fff; display: flex; align-items: center;
    gap: 3px; font-size: 12px; font-weight: 700; color: #081c36; box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
  .zl-in { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: #fff; border-top: 1px solid #d6dbe1; display: flex; align-items: center;
    gap: 12px; padding: 0 14px; color: #7589a3; }
  .zl-in .ph { flex: 1; }
</style>
