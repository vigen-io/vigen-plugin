<!-- The ranking board: a numbered list in two columns (1…N/2 on the left, the rest on the right) on the
     presenter's chest, filled in one guess at a time. Each guessed name pops up above the board as the presenter
     says it, waits through the host's confirmation, and flies into its slot on "top N". A guess shown with a
     product photo (a shots panel, `card: true` here) hides the board while the photo is up and stages the name
     higher, over the photo. The last slot nobody found gets a "???" (the CTA). Measured at 60 fps from the
     references (FORMAT.md § 2): every number below is px of the 1080×1920 frame.

     Copy into the project's cards/ and edit only THEME, SLOTS, BOARD_IN, ITEMS, MYSTERY and CLEAR (times on the
     video clock, from transcript.json). Place it as a viz-cards html card spanning the whole video,
     "bg": "transparent", cards.json "size": { "w": 1080, "h": 1920 }, with the shots layout "over". The fonts
     come from the template's fonts/ (copied into assets/fonts/). -->
<style>
  @font-face { font-family: "Montserrat"; font-weight: 100 900; src: url("assets/fonts/Montserrat.ttf"); }
  @font-face { font-family: "Quicksand"; font-weight: 300 700; src: url("assets/fonts/Quicksand.ttf"); }
  @font-face { font-family: "Playfair Display"; font-weight: 400 900; src: url("assets/fonts/PlayfairDisplay.ttf"); }
  .rb { position: absolute; inset: 0; }
  /* an anchor is a zero-size point at the element's centre: it moves, scales and fades; its text stays centred on it */
  .rb-a { position: absolute; width: 0; height: 0; opacity: 0; }
  .rb-in { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); text-align: center; width: max-content; }
  .rb-star { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; opacity: 0;
    filter: drop-shadow(0 0 6px rgba(255, 230, 80, 0.9)); }
</style>
<div class="rb" id="rb"></div>
<script>
  // ── edit these ──
  const THEME = "gold";   // "gold": yellow names, white serif numbers (ref-1) | "aqua": cyan names, cream numbers (ref-2)
  const SLOTS = 8;        // the list's length ("Top 8"): two columns, the left one holds 1…ceil(N/2)
  const BOARD_IN = 3.0;   // the empty list appears: the cut that ends the hook (title gone)
  // name: as on screen (the brand's own spelling; past ≈ 380 px it wraps to two lines). rank: its slot. in: the presenter
  // starts saying it. fly: the host says "top N". card: true when a product photo (a shots panel with
  // "blur": true, "in": "white", from `in` to `fly` + 0.03) shows with it: the board hides meanwhile.
  // These are ref-1's own times: retime every one to the project's transcript.json.
  const ITEMS = [
    { name: "Mill Creek", rank: 5, in: 4.13, fly: 6.85, card: true },
    { name: "Ruby Eyes", rank: 3, in: 13.02, fly: 15.22, card: true },
    { name: "Huỳnh Anh lens", rank: 2, in: 24.65, fly: 27.22 },
    { name: "Starlens", rank: 4, in: 38.3, fly: 40.6, card: true },
    { name: "Mystic Eyes", rank: 6, in: 47.45, fly: 49.4, card: true },
    { name: "UYAAI", rank: 7, in: 57.05, fly: 60.2, card: true },
    { name: "Eyeshare", rank: 1, in: 66.45, fly: 68.6, card: true },
  ];
  const MYSTERY = { rank: 8, at: 82.72 };   // the slot left for the comments: "???" as the host/presenter asks; null for none
  const CLEAR = E - 0.1;                    // everything off for the last frames (ref-1); null keeps the board to the end (ref-2)

  // ── the look, per theme (measured) ──
  const ring = (px, c) => [[px, 0], [-px, 0], [0, px], [0, -px], [px * 0.7, px * 0.7], [-px * 0.7, px * 0.7], [px * 0.7, -px * 0.7], [-px * 0.7, -px * 0.7]]
    .map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px 0 ${c}`).join(", ");
  const THEMES = {
    gold: {
      rows: 4, top: 1135, step: 152, numX: [125, 615], nameX: [360, 852], nameMax: [380, 412], stageY: 1025, cardStageY: 955,
      num: `font-family:"Playfair Display";font-weight:900;font-size:60px;font-variant-numeric:lining-nums;color:#fff;text-shadow:${ring(2, "rgba(20,10,10,0.75)")}, 0 4px 6px rgba(0,0,0,0.45)`,
      numIn: "#FFE81A",
      name: `font-family:"Montserrat";font-weight:900;font-size:66px;line-height:0.86;letter-spacing:-0.005em;color:#FFE81A;text-shadow:${ring(4, "#3A0808")}, 0 6px 0 #2A0505, 0 8px 12px rgba(0,0,0,0.45)`,
      mystery: `font-family:"Montserrat";font-weight:900;font-size:58px;color:#fff;text-shadow:${ring(5, "#E3122E")}, 0 0 14px #FF2340, 0 0 26px rgba(255,35,64,0.8)`,
      enter: "stagger", pop: "glow", fly: 0.15, glow: "#FFE81A",
    },
    aqua: {
      rows: 5, top: 1125, step: 110, numX: [122, 597], nameX: [335, 822], nameMax: [360, 400], stageY: 1015, cardStageY: 955,
      num: `font-family:"Quicksand";font-weight:700;font-size:54px;color:#F8F29A;text-shadow:${ring(3, "#262626")}, 0 4px 6px rgba(0,0,0,0.35)`,
      numIn: "#F8F29A",
      name: `font-family:"Quicksand";font-weight:700;font-size:62px;line-height:0.9;color:#7FF6EF;text-shadow:${ring(4, "#0C2340")}, 0 5px 8px rgba(0,0,0,0.4)`,
      mystery: `font-family:"Quicksand";font-weight:700;font-size:62px;color:#E3182D;text-shadow:${ring(4, "#fff")}, 0 4px 8px rgba(0,0,0,0.35)`,
      enter: "all", pop: "bounce", fly: 0.18, glow: "#7FF6EF",
    },
  };
  const T = THEMES[THEME];

  // ── the board ──
  const q = (s) => CARD + " " + s;
  const root = document.querySelector(q("#rb"));
  const rows = Math.ceil(SLOTS / 2);
  // the theme's own list length keeps its spacing; another length keeps the same middle (and stays under 1700)
  const mid = T.top + (T.step * (T.rows - 1)) / 2;
  const step = rows > 1 ? Math.min(T.step, (1700 - mid) / ((rows - 1) / 2)) : 0;
  const top = Math.round(mid - (step * (rows - 1)) / 2);
  const slot = (rank) => { const c = rank > rows ? 1 : 0, r = (rank - 1) % rows; return { c, x: T.nameX[c], y: top + step * r, numX: T.numX[c] }; };
  const anchor = (id, x, y, css, html) => {
    const a = document.createElement("div"); a.className = "rb-a"; a.id = id; a.style.left = `${x}px`; a.style.top = `${y}px`;
    a.innerHTML = `<div class="rb-in" style='${css}'>${html}</div>`; root.appendChild(a); return a;
  };
  const at = (s, from, to, t, d = 0.3, ease = "power2.out") => tl.fromTo(q(s), from, { ...to, duration: d, ease, immediateRender: false }, t);

  // numbers: "1." … "N."
  const nums = [];
  for (let k = 1; k <= SLOTS; k++) { const p = slot(k); anchor(`rb-n${k}`, p.numX, p.y, T.num, `${k}.`); nums.push(k); }
  if (T.enter === "stagger") {
    // row by row, both columns together, 0.083 s apart: each number lands yellow and 1.25×, turns white 0.05 s later
    for (let k = 1; k <= SLOTS; k++) {
      const r = (k - 1) % rows, t0 = BOARD_IN + 0.083 * r;
      tl.set(q(`#rb-n${k}`), { opacity: 1, scale: 1.25 }, t0);
      tl.set(q(`#rb-n${k} .rb-in`), { color: T.numIn }, t0);
      at(`#rb-n${k}`, { scale: 1.25 }, { scale: 1 }, t0 + 0.05, 0.05, "power1.out");
      tl.set(q(`#rb-n${k} .rb-in`), { color: "#fff" }, t0 + 0.05);
    }
    // a scatter of yellow twinkles around the numbers while they land
    let seed = 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
    for (let i = 0; i < 9; i++) {
      const st = document.createElement("div"); st.className = "rb-star"; st.id = `rb-s${i}`;
      st.style.left = `${Math.round(60 + rnd() * 960)}px`; st.style.top = `${Math.round(top - 40 + rnd() * (step * (rows - 1) + 80))}px`;
      st.innerHTML = `<svg viewBox="-10 -10 20 20" width="34" height="34"><path d="M0-10C1 -2 2 -1 10 0C2 1 1 2 0 10C-1 2-2 1-10 0C-2-1-1-2 0-10Z" fill="#FFE45C"/></svg>`;
      root.appendChild(st);
      const t0 = BOARD_IN + 0.04 + rnd() * 0.3, sc = 0.5 + rnd() * 0.7;
      at(`#rb-s${i}`, { opacity: 0, scale: 0 }, { opacity: 1, scale: sc }, t0, 0.06, "power2.out");
      at(`#rb-s${i}`, { opacity: 1, scale: sc }, { opacity: 0, scale: 0 }, t0 + 0.1, 0.16, "power1.in");
    }
  } else {
    // all at once: from a sliver to full size in 0.1 s with a small overshoot
    nums.forEach((k) => at(`#rb-n${k}`, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1 }, BOARD_IN, 0.1, "back.out(3)"));
  }

  // a name (or the "???") appearing: glow = flares up wide-spaced and blurred in yellow light, tightening in 0.15 s
  // (gold); bounce = squashed flat, springs to size with two overshoots (aqua)
  const pop = (id, t) => {
    if (T.pop === "glow") {
      at(`#${id}`, { opacity: 0 }, { opacity: 1 }, t, 0.05, "none");
      at(`#${id}`, { filter: `blur(5px) brightness(1.7) drop-shadow(0 0 16px ${T.glow})` }, { filter: `blur(0px) brightness(1) drop-shadow(0 0 0px ${T.glow})` }, t, 0.26, "power2.out");
      at(`#${id} .rb-in`, { letterSpacing: "0.45em" }, { letterSpacing: "0em" }, t, 0.15, "power2.out");
    } else {
      at(`#${id}`, { opacity: 0, scaleX: 1.3, scaleY: 0.1 }, { opacity: 1, scaleX: 1, scaleY: 1 }, t, 0.42, "elastic.out(1.1, 0.35)");
    }
  };

  ITEMS.forEach((it, i) => {
    const p = slot(it.rank), sy = it.card ? T.cardStageY : top - 110, id = `rb-i${i}`;
    // the name waits at the stage (centred above the board), its text wrapped as it will sit in its column
    anchor(id, 540, sy, `${T.name};max-width:${T.nameMax[p.c]}px`, it.name);
    pop(id, it.in);
    // the flight: straight to its slot, the same size, eased both ends
    at(`#${id}`, { x: 0, y: 0 }, { x: p.x - 540, y: p.y - sy }, it.fly, T.fly, "power2.inOut");
    if (it.card) {
      // the product photo takes the chest: the board (numbers and the names already in) cuts out until the flight
      const board = [...nums.map((k) => `#rb-n${k}`), ...ITEMS.slice(0, i).map((_, j) => `#rb-i${j}`)];
      board.forEach((s) => { tl.set(q(s), { opacity: 0 }, it.in); tl.set(q(s), { opacity: 1 }, it.fly); });
    }
  });
  if (MYSTERY) {
    const p = slot(MYSTERY.rank);
    anchor("rb-q", p.x, p.y, T.mystery, "???");
    pop("rb-q", MYSTERY.at);
  }
  if (CLEAR != null) tl.set(q("#rb"), { opacity: 0 }, CLEAR);
</script>
