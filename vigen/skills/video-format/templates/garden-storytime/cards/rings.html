     translate(x, y)") to centre them on someone else. Place it BEHIND the presenter: shots layout "behind" with

  const at = (s, from, to, t, d = 0.3, ease = "power2.out") => tl.fromTo(q(s), from, { ...to, duration: d, ease, immediateRender: false }, t);

  const AT = S + 0.1;     // the payoff word
