<script>
  const q = (s) => CARD + " " + s;
  const at = (s, from, to, t, d = 0.3, ease = "power2.out") => tl.fromTo(q(s), from, { ...to, duration: d, ease, immediateRender: false }, t);

  const draw = (s, t, d = 0.4) => at(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0 }, t, d, "power1.inOut");
  const gone = (s, t, d = 0.25) => at(s, { opacity: 1 }, { opacity: 0 }, t, d, "power1.in");
  // ── retime to the words (video seconds): each part's name ──
  const AT = [S + 0.3, S + 2.0, S + 3.6, S + 5.2];

  AT.forEach((t, i) => {
    at(`#lp-t${i + 1}`, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1 }, t, 0.2, "back.out(2)");
    draw(`#lp-e${i + 1}`, t + 0.05, 0.45);
    // the line carries on to the next part as it is named (the last one trails off the bottom)
    const next = AT[i + 1] ?? Math.min(E - 0.6, t + 1.6);
    draw(`#lp-s${i + 1}`, t + 0.5, Math.max(0.4, next - t - 0.55));
  });
